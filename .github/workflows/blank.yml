name: Publish report

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pandoc/latex

    steps:
      - uses: actions/checkout@v4

      - name: Build PDF
        run: pandoc informe.md -o informe.pdf

      - name: Build HTML
        run: pandoc informe.md -s --mathjax -o index.html

      - name: Prepare Pages
        run: |
          mkdir public
          cp index.html public/
          cp informe.pdf public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
